name: Frontend CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz
          tar -xvf oc.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Login OpenShift
        run: |
          oc login ${{ secrets.OPENSHIFT_API }}             --token=${{ secrets.OPENSHIFT_TOKEN }}             --insecure-skip-tls-verify=true

      - name: Trigger Frontend Build
        run: |
          oc start-build observaai-frontend             --from-dir=frontend             --follow             -n ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Rollout Frontend
        run: |
          oc rollout restart deployment/observaai-frontend             -n ${{ secrets.OPENSHIFT_NAMESPACE }}
