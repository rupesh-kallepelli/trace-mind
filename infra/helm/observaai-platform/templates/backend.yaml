apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: observaai-backend
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: observaai-backend

spec:
  source:
    type: Binary

  strategy:
    type: Docker

  output:
    to:
      kind: ImageStreamTag
      name: observaai-backend:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observaai-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: observaai-backend

  template:
    metadata:
      labels:
        app: observaai-backend

    spec:

      ##################################################################
      # SERVICE ACCOUNT
      ##################################################################

      serviceAccountName: observaai-sa

      ##################################################################
      # DISABLE DEFAULT TOKEN MOUNT
      ##################################################################

      automountServiceAccountToken: false

      ##################################################################
      # CONTAINERS
      ##################################################################

      containers:

      - name: backend

        image: image-registry.openshift-image-registry.svc:5000/kallepelli-rupesh-dev/observaai-backend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        ##################################################################
        # ENV
        ##################################################################

        envFrom:
        - configMapRef:
            name: observaai-config

        - secretRef:
            name: observaai-secrets

        env:

        ##################################################################
        # GCP SERVICE ACCOUNT
        ##################################################################

        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app/keys/key.json

        ##################################################################
        # MANUAL K8S CONFIG
        ##################################################################

        - name: K8S_TOKEN_PATH
          value: /app/k8s-auth/token

        - name: K8S_CA_CERT
          value: /app/k8s-auth/ca.crt

        - name: K8S_NAMESPACE_PATH
          value: /app/k8s-auth/namespace

        - name: K8S_HOST
          value: https://kubernetes.default.svc

        ##################################################################
        # VOLUME MOUNTS
        ##################################################################

        volumeMounts:

        ##################################################################
        # GCP KEY
        ##################################################################

        - name: gcp-key
          mountPath: /app/keys
          readOnly: true

        ##################################################################
        # MANUAL K8S AUTH
        ##################################################################

        - name: k8s-auth
          mountPath: /app/k8s-auth
          readOnly: true

        ##################################################################
        # READINESS PROBE
        ##################################################################

        readinessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 30
          periodSeconds: 10

        ##################################################################
        # LIVENESS PROBE
        ##################################################################

        livenessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 60
          periodSeconds: 20

        ##################################################################
        # OPENSHIFT SECURITY
        ##################################################################

        securityContext:
          allowPrivilegeEscalation: false

        ##################################################################
        # RESOURCES
        ##################################################################

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"

          limits:
            memory: "1Gi"
            cpu: "500m"

      ##################################################################
      # VOLUMES
      ##################################################################

      volumes:

      ##################################################################
      # GCP SERVICE ACCOUNT
      ##################################################################

      - name: gcp-key
        secret:
          secretName: gcp-service-account

      ##################################################################
      # MANUAL K8S AUTH
      ##################################################################

      - name: k8s-auth
        projected:
          sources:

          ##################################################################
          # SERVICE ACCOUNT TOKEN
          ##################################################################

          - serviceAccountToken:
              path: token
              expirationSeconds: 3600

          ##################################################################
          # CLUSTER CA CERT
          ##################################################################

          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt

          ##################################################################
          # CURRENT NAMESPACE
          ##################################################################

          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: observaai-backend
spec:
  selector:
    app: observaai-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: observaai-backend
spec:
  to:
    kind: Service
    name: observaai-backend
  tls:
    termination: edge