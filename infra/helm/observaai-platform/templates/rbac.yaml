apiVersion: v1
kind: ServiceAccount
metadata:
  name: observaai-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observaai-role
rules:
- apiGroups: [""]
  resources: ["pods","pods/log","services","events","namespaces"]
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","replicasets"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observaai-rolebinding
subjects:
- kind: ServiceAccount
  name: observaai-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observaai-role